<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#177245"><link rel="manifest" href="manifest.json"><title>マレットゴルフ スコア表 Ver.1.5.1</title><style>
:root{--g:#177245;--p:#eef8f1;--c:#fff5d9;--l:#cddbd2;--r:#c62828;--b:#1565c0}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#f6faf7;color:#223129}.app{max-width:1180px;margin:auto;min-height:100vh;background:#fff}header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--l);padding:9px}.title{font-weight:800;color:var(--g);font-size:clamp(20px,4vw,31px);text-align:center}.badge{display:inline-block;background:var(--g);color:#fff;border-radius:999px;padding:2px 9px;font-size:.55em}.sub{text-align:center;font-size:12px;color:#68756d}.screen{padding:10px}.hidden{display:none!important}.panel{border:1px solid var(--l);border-radius:14px;padding:12px}.member-row{display:grid;grid-template-columns:42px 1fr;gap:8px;align-items:center;margin:8px 0}.member-row input[type=checkbox]{width:26px;height:26px}.member-row input[type=text]{width:100%;font-size:20px;padding:12px;border:1px solid #b9c9bf;border-radius:10px}.actions,.small-actions,.tabs{display:flex;gap:8px;flex-wrap:wrap}.btn{border:none;border-radius:11px;padding:12px 15px;font-weight:700}.primary{background:var(--g);color:#fff}.soft{background:#edf2ef;color:#234}.danger{background:#fbe4e4;color:#a11}.outline{background:#fff;color:var(--g);border:2px solid var(--g)}.score-head{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.score-head h2{margin:0;color:var(--g);font-size:18px}.small-actions .btn{padding:8px 10px;font-size:13px}.tabs{margin:9px 0}.tabs .btn{flex:1}.wrap{overflow:hidden;border:1px solid var(--l);border-radius:12px}table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}th,td{border-right:1px solid var(--l);border-bottom:1px solid var(--l);text-align:center;padding:5px}th:last-child,td:last-child{border-right:none}tr:last-child td{border-bottom:none}thead th{background:var(--g);color:#fff}.h{width:58px;min-width:0;background:#f4f8f5;font-weight:800}.par{width:48px;min-width:0;background:#f4f8f5}.same{display:block;font-size:11px;color:var(--g);text-decoration:underline;margin-top:2px}.sc{min-width:0;height:44px;font-size:22px;font-weight:800}.filled{background:var(--c)}.birdie{color:var(--r)}.eagle{color:var(--b)}.active{outline:3px solid #3aa36a;outline-offset:-3px}.total td{background:#eaf6ee;font-weight:900;font-size:22px}.note{font-size:12px;color:#68756d;margin-top:7px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}.card{background:#fff;width:min(560px,100%);border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}.mt{text-align:center;font-weight:800;font-size:18px;margin-bottom:12px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.key{padding:15px 4px;border:none;border-radius:12px;background:var(--g);color:#fff;font-size:23px;font-weight:800}.alt{background:#e8eee9;color:#223}.plus{background:#fff;color:var(--r);border:2px solid var(--r)}.plusrow{display:flex;gap:8px;margin-top:8px}.plusrow input{flex:1;padding:12px;border:1px solid var(--l);border-radius:10px;font-size:20px}
#tbl.players-5 th,#tbl.players-5 td{padding:4px 2px}
#tbl.players-5 .sc{font-size:20px}
#tbl.players-5 .h{width:54px}

#tbl.players-6 .same{font-size:9px}
#tbl.players-7 th,#tbl.players-7 td{padding:3px 1px;font-size:13px}
#tbl.players-7 .sc{font-size:17px}
#tbl.players-7 .h{width:45px}
#tbl.players-7 .par{width:38px}
#tbl.players-7 .same{font-size:8px}
@media(max-width:700px){.screen{padding:6px}.score-head{grid-template-columns:1fr}.small-actions{justify-content:flex-start;gap:5px}.small-actions .btn{padding:8px 8px;font-size:12px}.tabs{gap:6px}.tabs .btn{padding:11px 5px}.title{font-size:clamp(18px,5vw,25px)}th,td{padding:4px 2px}.h{width:50px}.par{width:42px}.same{font-size:9px}.sc{font-size:19px}.total td{font-size:19px}#tbl.players-6 th,#tbl.players-6 td{font-size:13px;padding:3px 1px}#tbl.players-6 .sc{font-size:16px}#tbl.players-7 th,#tbl.players-7 td{font-size:11px;padding:2px 0}#tbl.players-7 .sc{font-size:15px}#tbl.players-7 .h{width:40px}#tbl.players-7 .par{width:33px}}@media print{header,.small-actions,.tabs,.note,.member-screen{display:none!important}.screen{padding:0}.wrap{overflow:visible;border:none}table{min-width:0;font-size:10pt}.sc{min-width:0;height:28px}}
</style></head><body><div class="app"><header><div class="title">マレットゴルフ ⛳ スコア表 <span class="badge">Ver.1.5.1</span></div><div class="sub">健康づくり・お遊び用 / アプリ確認版</div></header><main id="member" class="screen member-screen"><div class="panel"><h2 style="margin-top:0;color:var(--g)">メンバー入力</h2><div id="rows"></div><div class="actions"><button class="btn soft" onclick="clearScores()">スコアだけ消す</button><button class="btn primary" onclick="openScore()">スコア表を開く</button></div></div></main><main id="score" class="screen hidden"><div class="score-head"><h2 id="label">4人用レイアウト</h2><div class="small-actions"><button class="btn soft" onclick="backMembers()">← メンバーへ</button><button class="btn danger" onclick="clearScores()">スコア消去</button><button class="btn outline" onclick="clearScores()">第2ゲーム開始</button><button class="btn soft" onclick="print()">印刷</button></div></div><div class="tabs"><button id="ob" class="btn primary" onclick="setCourse('outer')">外回りコース</button><button id="ib" class="btn soft" onclick="setCourse('inner')">内回りコース</button></div><div class="wrap"><table id="tbl"></table></div><div class="note">※入力後、自動で次の人へ移動します。「全員同じ」で同じスコアを一括入力できます。</div></main></div><div id="modal" class="modal hidden"><div class="card"><div id="mt" class="mt">スコア入力</div><div class="keys"><button class="key" onclick="enter(1)">1</button><button class="key" onclick="enter(2)">2</button><button class="key" onclick="enter(3)">3</button><button class="key" onclick="enter(4)">4</button><button class="key" onclick="enter(5)">5</button><button class="key" onclick="enter(6)">6</button><button class="key" onclick="enter(7)">7</button><button class="key" onclick="enter(8)">8</button><button class="key" onclick="enter(9)">9</button><button class="key" onclick="enter(10)">10</button><button class="key plus" onclick="togglePlus()">＋</button><button class="key alt" onclick="erase()">消す</button></div><div id="plusrow" class="plusrow hidden"><input id="plusinput" type="number" min="11" value="11"><button class="btn primary" onclick="enterPlus()">入力</button></div><button class="btn soft" style="width:100%;margin-top:10px" onclick="closeModal()">閉じる</button></div></div><script>
const PARS={outer:[4,3,4,3,4,3,3,3,4],inner:[3,4,3,3,3,4,3,4,3]},defs=['岡田','石橋','松本','田中','山本','佐藤','鈴木'];let s=JSON.parse(localStorage.getItem('mg15')||'null')||{members:defs.map((n,i)=>({name:n,active:i<4})),scores:{outer:Array.from({length:9},()=>Array(7).fill(null)),inner:Array.from({length:9},()=>Array(7).fill(null))},course:'outer'};let a=null,sameMode=null;const save=()=>localStorage.setItem('mg15',JSON.stringify(s));const esc=x=>String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function build(){rows.innerHTML='';s.members.forEach((m,i)=>{let d=document.createElement('div');d.className='member-row';d.innerHTML=`<input type="checkbox" ${m.active?'checked':''} onchange="tog(${i},this.checked)"><input type="text" value="${esc(m.name)}" placeholder="名前 ${i+1}" oninput="ren(${i},this.value)">`;rows.appendChild(d)})}function tog(i,v){s.members[i].active=v;if(!s.members.some(x=>x.active)){s.members[i].active=true;build();alert('1人以上を選んでください')}save()}function ren(i,v){s.members[i].name=v||`名前${i+1}`;save()}function ids(){return s.members.map((m,i)=>m.active?i:null).filter(x=>x!==null)}function openScore(){let n=ids().length;member.classList.add('hidden');score.classList.remove('hidden');label.textContent=n<=4?'4人用レイアウト':`${n}人：横画面レイアウト`;render()}function backMembers(){score.classList.add('hidden');member.classList.remove('hidden');build()}function setCourse(c){s.course=c;save();render()}function render(){let is=ids(),p=PARS[s.course];tbl.className='players-'+is.length;ob.className='btn '+(s.course==='outer'?'primary':'soft');ib.className='btn '+(s.course==='inner'?'primary':'soft');let h='<thead><tr><th>H</th><th>PAR</th>'+is.map(i=>`<th>${esc(s.members[i].name)}</th>`).join('')+'</tr></thead><tbody>';for(let r=0;r<9;r++){h+=`<tr><td class="h">${r+1}<span class="same" onclick="sameAll(${r})">全員同じ</span></td><td class="par">${p[r]}</td>`;is.forEach(i=>{let v=s.scores[s.course][r][i],c=['sc'];if(v!==null){c.push('filled');if(v===p[r]-1)c.push('birdie');if(v<=p[r]-2)c.push('eagle')}if(a&&a.h===r&&a.i===i)c.push('active');h+=`<td class="${c.join(' ')}" onclick="openModal(${r},${i})">${v??'-'}</td>`});h+='</tr>'}h+=`<tr class="total"><td style="color:var(--g)">合計</td><td>${p.reduce((x,y)=>x+y,0)}</td>`+is.map(i=>{let v=s.scores[s.course].map(r=>r[i]).filter(x=>x!==null);return `<td>${v.length?v.reduce((x,y)=>x+y,0):'-'}</td>`}).join('')+'</tr></tbody>';tbl.innerHTML=h}function openModal(h,i){a={h,i};sameMode=null;mt.textContent=`${h+1}番　${s.members[i].name}さんのスコア`;modal.classList.remove('hidden');plusrow.classList.add('hidden');render()}function closeModal(){modal.classList.add('hidden');a=null;sameMode=null;render()}function enter(v){if(sameMode!==null){ids().forEach(i=>s.scores[s.course][sameMode][i]=v);save();closeModal();return}if(!a)return;s.scores[s.course][a.h][a.i]=v;save();next()}function erase(){if(!a)return;s.scores[s.course][a.h][a.i]=null;save();closeModal()}function next(){let is=ids(),q=is.indexOf(a.i);if(q<is.length-1)a={h:a.h,i:is[q+1]};else if(a.h<8)a={h:a.h+1,i:is[0]};else{return closeModal()}render();mt.textContent=`${a.h+1}番　${s.members[a.i].name}さんのスコア`}function togglePlus(){plusrow.classList.toggle('hidden');plusinput.focus()}function enterPlus(){let v=parseInt(plusinput.value);if(v>=11)enter(v)}function sameAll(h){sameMode=h;a={h,i:ids()[0]};mt.textContent=`${h+1}番　全員同じスコア`;modal.classList.remove('hidden');plusrow.classList.add('hidden')}function clearScores(){if(!confirm('スコアをすべて消しますか？'))return;s.scores={outer:Array.from({length:9},()=>Array(7).fill(null)),inner:Array.from({length:9},()=>Array(7).fill(null))};save();if(!score.classList.contains('hidden'))render()}build();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script></body></html>
